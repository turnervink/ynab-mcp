[project]
name = "ynab-mcp"
version = "0.1.0"
description = "MCP server for YNAB"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastmcp (>=4.0.10,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[project.scripts]
ynab-mcp = "ynab_mcp.__main__:main"

[tool.poetry]
packages = [{ include = "ynab_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"
ruff = "^0.16.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
